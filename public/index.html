<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFun - Multi-Cloud Storage</title>
  
  <!-- CSS Imports -->
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">

  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/gallery.css">
  <link rel="stylesheet" href="styles/categories.css">
  <link rel="stylesheet" href="styles/modal.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/dashboard.css">
  <link rel="stylesheet" href="styles/login.css">
  <link rel="stylesheet" href="styles/remotes.css">
  <link rel="stylesheet" href="styles/wizard.css">
</head>
<body>
  <!-- Main App Container -->
  <div id="app-root"></div>
  

  <!-- Media Player Modal -->
  <div class="modal-overlay media-player-modal" id="media-player-modal" role="dialog" aria-modal="true" aria-label="Media player">
    <div class="modal-content media-player-content">
      <!-- Media Header (for title and metadata) -->
      <div class="media-player-header" id="media-player-header">
        <div class="media-header-info">
          <h2 class="media-title" id="media-title"></h2>
          <p class="media-meta" id="media-meta"></p>
        </div>
        <button class="modal-close" id="media-player-close" aria-label="Close media player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      <!-- Navigation Buttons -->
      <button class="media-nav-btn media-prev-btn" id="media-prev-btn" aria-label="Previous image" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      
      <button class="media-nav-btn media-next-btn" id="media-next-btn" aria-label="Next image" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      
      <div id="media-player-content">
        <!-- Video or image will be dynamically inserted here -->
      </div>
    </div>
  </div>
  
  <!-- Notification Container -->
  <div id="notification-container" aria-live="polite" aria-atomic="true" style="position: fixed; top: 80px; right: 20px; z-index: 10000;"></div>
  
  <!-- Scripts -->
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
