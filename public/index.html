<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFun - Multi-Cloud Storage</title>
  
  <!-- CSS Imports -->
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/gallery.css">
  <link rel="stylesheet" href="styles/modal.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/remotes.css">
  <link rel="stylesheet" href="styles/wizard.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 7l-7 5 7 5V7z"></path>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <span>StreamFun</span>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <button class="nav-item active" data-category="videos" aria-label="View videos">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 7l-7 5 7 5V7z"></path>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <span>Videos</span>
        </button>
        
        <button class="nav-item" data-category="images" aria-label="View images">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <path d="M21 15l-5-5L5 21"></path>
          </svg>
          <span>Images</span>
        </button>
      </nav>
    </aside>
    
    <!-- Mobile Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    
    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <header class="header">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        
        <div class="header-title">
          <h1 id="category-title">Videos</h1>
          <span class="file-count" id="file-count">0 files</span>
        </div>
        
        <div class="header-actions">
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          
          <button class="dashboard-button" id="dashboard-button" aria-label="Open dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          </button>
        </div>
      </header>
      
      <!-- Gallery Container -->
      <main class="gallery-container">
        <!-- Loading State -->
        <div class="loading-state" id="loading-state" style="display: none;">
          <div class="spinner"></div>
          <p>Loading files...</p>
        </div>
        
        <!-- Gallery Grid -->
        <div class="gallery-grid" id="gallery-grid">
          <!-- Gallery items will be dynamically inserted here -->
        </div>
        
        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display: none;">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <h2 id="empty-title">No videos yet</h2>
          <p id="empty-description">Upload your first video to get started</p>
        </div>
      </main>
    </div>
  </div>
  
  <!-- Dashboard Modal -->
  <div class="modal-overlay dashboard-modal" id="dashboard-modal" role="dialog" aria-modal="true" aria-labelledby="dashboard-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="dashboard-title">Dashboard</h2>
        <button class="modal-close" id="dashboard-close" aria-label="Close dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      <div class="dashboard-tabs" role="tablist">
        <button class="dashboard-tab active" data-tab="stats" role="tab" aria-selected="true" aria-controls="dashboard-body">Statistics</button>
        <button class="dashboard-tab" data-tab="upload" role="tab" aria-selected="false" aria-controls="dashboard-body">Upload</button>
        <button class="dashboard-tab" data-tab="accounts" role="tab" aria-selected="false" aria-controls="dashboard-body">Accounts</button>
        <button class="dashboard-tab" data-tab="remotes" role="tab" aria-selected="false" aria-controls="dashboard-body">Cloud Storage</button>
      </div>
      
      <div class="dashboard-body" id="dashboard-body" role="tabpanel">
        <!-- Dashboard tab content will be dynamically inserted here -->
      </div>
    </div>
  </div>
  
  <!-- Media Player Modal -->
  <div class="modal-overlay media-player-modal" id="media-player-modal" role="dialog" aria-modal="true" aria-label="Media player">
    <div class="modal-content media-player-content">
      <button class="modal-close" id="media-player-close" aria-label="Close media player">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      
      <div id="media-player-content">
        <!-- Video or image will be dynamically inserted here -->
      </div>
      
      <div class="media-info" id="media-info" style="display: none;">
        <h2 class="media-title" id="media-title"></h2>
        <p class="media-meta" id="media-meta"></p>
      </div>
    </div>
  </div>
  
  <!-- Notification Container -->
  <div id="notification-container" aria-live="polite" aria-atomic="true" style="position: fixed; top: 80px; right: 20px; z-index: 10000;"></div>
  
  <!-- Scripts -->
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
